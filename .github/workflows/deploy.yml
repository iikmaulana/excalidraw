name: CI/CD Deploy to Tencent Cloud

# Build the static Vite SPA in CI, then rsync the `excalidraw-app/build/`
# output to the web server. The server only serves static files (nginx) —
# there is no Node/PM2 process for this app, so the old `pm2 restart` step
# was removed.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# One deploy at a time; a newer push supersedes an in-flight deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (lint + typecheck + vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Lint
        run: yarn test:code

      - name: Typecheck
        run: yarn test:typecheck

      - name: Build
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: excalidraw-app/build
          retention-days: 1

  deploy:
    name: Deploy static build via rsync
    runs-on: ubuntu-latest
    needs: build
    # Optional: gate production deploys behind an environment you can protect in
    # repo Settings -> Environments. GitHub creates it lazily on first run.
    environment: dev-server
    env:
      # Override in Settings -> Actions -> Variables (e.g. a different web root).
      WEB_ROOT: ${{ vars.WEB_ROOT || '/var/www/excalidraw' }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: excalidraw-app/build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

      - name: Rsync build to server
        run: |
          rsync -az --delete \
            --itemize-changes \
            -e "ssh -p $SERVER_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            excalidraw-app/build/ "$SERVER_USER@$SERVER_HOST:$WEB_ROOT/"
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
